name: Giphy check (temporary)

on:
  push:
    paths:
      - '.github/workflows/giphy-check.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every celebration gif as the app does
        run: |
          for id in $(grep -o "id: '[^']*'" src/lib/celebrationGifs.ts | cut -d"'" -f2); do
            for size in giphy 200w; do
              curl -sS -L -o /tmp/g -e https://a102032.github.io/ -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8' \
                -w "$id $size: %{http_code} %{content_type} %{size_download} bytes -> %{url_effective}\n" "https://i.giphy.com/media/$id/$size.gif" || echo "$id $size: failed"
              head -c 6 /tmp/g | od -c | head -1
            done
          done
