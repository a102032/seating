name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages, but nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The Move tab helper (tools/move-tab), served beside the app so the teacher downloads it from
      # the app's own address. Windows-only, but it builds here: .NET Framework's reference
      # assemblies come from NuGet. Its own workflow checks it on a Windows desktop.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the Move tab helper
        run: |
          dotnet build tools/move-tab -c Release -o move-tab-bin
          mkdir -p dist/move-tab
          cp move-tab-bin/ClassYesMove.exe dist/move-tab/ClassYesMove.exe

      # The Move extension (tools/move-extension), zipped in a folder of its own name for Chrome's
      # Load unpacked: the test copy a teacher adds by hand, before it is in the Chrome Web Store.
      - name: Pack the Move extension
        run: |
          mkdir -p dist/move-extension "$RUNNER_TEMP/pack"
          cp -r tools/move-extension "$RUNNER_TEMP/pack/class-yes-move"
          (cd "$RUNNER_TEMP/pack" && zip -qr "$GITHUB_WORKSPACE/dist/move-extension/class-yes-move.zip" class-yes-move)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A green deploy says the artifact was published, not that the site serves it.
      # Pages silently served the repo's source index.html for several runs while every
      # step here reported success, so check what actually comes back over HTTP.
      - name: Verify the published site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          html=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url")

          if grep -q 'src/main.tsx' <<<"$html"; then
            echo "::error::Serving the unbuilt index.html - Pages is not using the Actions artifact."
            exit 1
          fi
          if ! grep -qE 'src="[^"]*/assets/index-[^"]+\.js"' <<<"$html"; then
            echo "::error::No built bundle referenced in the served HTML."
            echo "$html"
            exit 1
          fi
          echo "Served HTML references the built bundle."

          # The Move tab helper is downloaded from the live site, so check it is there and is a program.
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o helper.exe "${url%/}/move-tab/ClassYesMove.exe"
          if [ "$(head -c 2 helper.exe)" != "MZ" ] || [ "$(stat -c %s helper.exe)" -lt 10000 ]; then
            echo "::error::The Move tab helper isn't served at move-tab/ClassYesMove.exe."
            exit 1
          fi
          echo "Serves the Move tab helper ($(stat -c %s helper.exe) bytes)."

          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o move.zip "${url%/}/move-extension/class-yes-move.zip"
          if [ "$(head -c 2 move.zip)" != "PK" ]; then
            echo "::error::The Move extension isn't served at move-extension/class-yes-move.zip."
            exit 1
          fi
          echo "Serves the Move extension ($(stat -c %s move.zip) bytes)."
