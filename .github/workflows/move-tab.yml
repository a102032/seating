name: Move tab helper

# The Move tab helper is a small Windows program, and nothing here runs Windows, so every change to
# it is built and checked on GitHub's Windows computers: a stand-in floating window, the tab found
# and hung off it, then dragged by mouse and by a finger held still first.
on:
  push:
    paths:
      - 'tools/move-tab/**'
      - 'design/move-hand.svg'
      - '.github/workflows/move-tab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build tools/move-tab -c Release -o move-tab-bin

      - name: Self-test on a Windows desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath move-tab-bin\ClassYesMove.exe -ArgumentList '--self-test','self-test' -PassThru -Wait
          Get-Content self-test\results.txt
          # The tab's pictures, readable from the log where the artifact can't be fetched.
          foreach ($name in 'tab-100', 'tab-300') {
            $file = "self-test\$name.png"
            if (Test-Path $file) {
              $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file))
              Write-Output "PICTURE $name $($b64.Length)"
              for ($i = 0; $i -lt $b64.Length; $i += 2000) { Write-Output ("B64 $name " + $b64.Substring($i, [Math]::Min(2000, $b64.Length - $i))) }
            }
          }
          if ($p.ExitCode -ne 0) { Write-Error "$($p.ExitCode) check(s) failed"; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: move-tab-self-test
          path: |
            self-test
            move-tab-bin/ClassYesMove.exe
