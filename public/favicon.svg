<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Class? Yes! mascot: the splash screen's chalkboard, cheering. Drawn for 16px up,
       so one star, no chalk grain, and outlines heavy enough to survive a browser tab. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Arms thrown up: a dark outline under chalk white so they read on any tab colour. -->
    <path d="M14 42 Q8 30 5.5 15 M50 42 Q56 30 58.5 15" stroke="#1f4a3b" stroke-width="8" fill="none"/>
    <path d="M14 42 Q8 30 5.5 15 M50 42 Q56 30 58.5 15" stroke="#f4f1e8" stroke-width="4.2" fill="none"/>
    <circle cx="5.5" cy="13" r="4.3" fill="#f4f1e8" stroke="#1f4a3b" stroke-width="2"/>
    <circle cx="58.5" cy="13" r="4.3" fill="#f4f1e8" stroke="#1f4a3b" stroke-width="2"/>
    <!-- The board: wood frame, green slate. -->
    <rect x="10" y="17" width="44" height="40" rx="5.5" fill="#d9924a" stroke="#1f4a3b" stroke-width="2.5"/>
    <rect x="14.5" y="21.5" width="35" height="31" rx="2.5" fill="#3f7a55" stroke="#1f4a3b" stroke-width="1.6"/>
    <!-- The face, in chalk: eyes shut with joy, and a big open smile. -->
    <path d="M22 34 a4 4 0 0 1 8 0 M34 34 a4 4 0 0 1 8 0" stroke="#f4f1e8" stroke-width="2.8" fill="none"/>
    <path d="M24.5 39.5 h15 a7.5 7 0 0 1 -15 0 z" fill="#f4f1e8"/>
    <!-- One star, over its head. -->
    <path d="M32 1 l2.1 4.3 4.7 .6 -3.5 3.2 .9 4.6 -4.2-2.4 -4.2 2.4 .9-4.6 -3.5-3.2 4.7-.6 z" fill="#f4f1e8" stroke="#1f4a3b" stroke-width="1.5"/>
  </g>
</svg>
